version: "3.8"
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    build: .
    ports:
      - 3000:8000      # host:container mapping (optional, Traefik uses internal port)
      - 9100:9000
    environment:
      - SHELL=/bin/bash
    depends_on:
      - mariadb
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frappe.rule=Host(`frap.web.musketeers.dev`)"
      - "traefik.http.services.frappe.loadbalancer.server.port=8000"  # internal container port Frappe is listening on
      - "traefik.http.routers.frappe.entrypoints=web"
      # Optional: SocketIO support
      - "traefik.tcp.routers.frappe-socket.rule=HostSNI(`frap.web.musketeers.dev`)"
      - "traefik.tcp.routers.frappe-socket.service=frappe-socket"
      - "traefik.tcp.services.frappe-socket.loadbalancer.server.port=9000"

volumes:
  mariadb-data:
