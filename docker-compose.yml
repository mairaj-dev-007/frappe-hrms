version: "3.8"

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: Frappe-HRMS-db
      MYSQL_USER: Frappe-HRMS-db
      MYSQL_PASSWORD: mairaj1122@
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    build: .
    expose:
      - "8000"
      - "9000"
    environment:
      - SHELL=/bin/bash

      # ---- Database connection ----
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=Frappe-HRMS-db
      - DB_USER=Frappe-HRMS-db
      - DB_PASSWORD=mairaj1122@
      - MARIADB_ROOT_PASSWORD=123

      # ---- Redis connection ----
      - REDIS_CACHE=redis://redis:6379/0
      - REDIS_QUEUE=redis://redis:6379/1
      - REDIS_SOCKETIO=redis://redis:6379/2

      # ---- Site configuration ----
      - SITE_NAME=frap.web.musketeers.dev
      - ADMIN_PASSWORD=admin123
      - INSTALL_APPS=hrms

    depends_on:
      - mariadb
      - redis

    command: >
      bash -c "
      if [ ! -d /home/frappe/frappe-bench/sites/${SITE_NAME} ];
      then
        bench new-site ${SITE_NAME}
          --mariadb-root-password=$MARIADB_ROOT_PASSWORD
          --admin-password=$ADMIN_PASSWORD
          --db-name=$DB_NAME
          --force &&
        bench --site ${SITE_NAME} install-app hrms;
      fi &&
      bench start
      "

volumes:
  mariadb-data:
